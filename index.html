<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Interactive Venue Ticketing</title>
</head>
<body>
    <header>
        <h1>Azerbaijan State Academic Russian Drama Theater Hall</h1>
    </header>

    <main class="layout">
        <section class="map-area" aria-label="Venue map">
            <div class="viewport" id="viewport">
                <div id="venue"></div>
            </div>
            <ul class="color-guide" id="color-guide"></ul>
        </section>

        <aside class="side-panel">

            <section id="seat-details">
                <h2>Seat details</h2>
                <p>Section: <span id="detail-section">-</span></p>
                <p>Row: <span id="detail-row">-</span></p>
                <p>Seat: <span id="detail-number">-</span></p>
                <p>Price: <span id="detail-price">-</span></p>
                <button id="add-to-cart" type="button" disabled>ADD TO CART</button>
            </section>

            <section id="cart">
                <h2>Your cart</h2>
                <ul id="cart-items"></ul>
                <p>Total: <strong id="cart-total">0</strong> AZN</p>
            </section>
        </aside>
    </main>

    <script src="js/venue-data.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
