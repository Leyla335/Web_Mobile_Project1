<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Interactive Venue Ticketing</title>
</head>
<body>
    <header>
        <h1>Azerbaijan State Academic Russian Drama Theater Hall</h1>
    </header>

    <main class="layout">
        <section class="map-area" aria-label="Venue map">
            <div class="viewport" id="viewport">
                <div id="venue"></div>
            </div>
        </section>

        <aside class="side-panel">
            <section id="seat-details" aria-live="polite">
                <h2>Seat details</h2>
                <p>Select a seat to inspect it.</p>
            </section>

            <section id="cart">
                <h2>Your cart</h2>
                <ul id="cart-items"></ul>
                <p>Total: <strong id="cart-total">0</strong> AZN</p>
            </section>
        </aside>
    </main>

    <script src="js/venue-data.js"></script>
    <script src="js/main.js"></script>
    
</body>
</html>
